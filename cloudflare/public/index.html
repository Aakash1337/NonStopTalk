<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="NonStopTalk is a private, on-device speech coach and live speaking game.">
  <title>NonStopTalk</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/" data-home>NonStopTalk</a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="/practice" data-route data-nav>Practice</a>
      <a href="/" data-route data-nav>Play</a>
      <a href="/progress" data-route data-nav>Progress</a>
    </nav>
    <span class="live-pill">On-device + live</span>
  </header>
  <main id="app" class="shell" tabindex="-1">
    <section class="loading-card" role="status">Loading NonStopTalk…</section>
  </main>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
