name: Production health

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: production-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: Read-only ${{ matrix.environment }} policy probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            origin: https://dontstoptalking.org
            expected_delivery: durable-outbox
          - environment: staging
            origin: https://nonstoptalk-staging.aakashplays656.workers.dev
            expected_delivery: durable-outbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check public routes and platform readiness
        env:
          NONSTOPTALK_PRODUCTION_ORIGIN: ${{ matrix.origin }}
          NONSTOPTALK_EXPECTED_ANALYTICS_DELIVERY: ${{ matrix.expected_delivery }}
        run: npm run smoke:production
