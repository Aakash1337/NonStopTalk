name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm clean-install
      - run: npm run audit:dependencies
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm run test:coach
      - run: npm run test:cloud-progress
      - run: npm run check:cloudflare-types
      - run: npm run typecheck:cloudflare
      - run: npm run test:cloudflare
      - run: npm run test:cloudflare-runtime
      - run: npm run check:cloudflare
      - run: npm run check:cloudflare-staging
      - run: npm run check:cloudflare-startup
      - run: npm run smoke:platform
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:coach
      - run: npm run smoke
